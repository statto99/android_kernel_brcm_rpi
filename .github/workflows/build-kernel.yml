name: Build RPi4 Research Kernel
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'raspberry-vanilla/android_kernel_brcm_rpi'
          ref: 'android-13.0'

      - name: Install Toolchain and Dependencies
* run: |
          sudo apt-get update
          # Added libelf-dev, pahole, and zlib1g-dev for BTF support
          sudo apt-get install -y bc bison flex libssl-dev make crossbuild-essential-arm64 libelf-dev pahole zlib1g-dev

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make bcm2711_defconfig
          
          # Hardware Breakpoints & Debugging
          ./scripts/config --enable CONFIG_HW_BREAKPOINT
          ./scripts/config --enable CONFIG_HAVE_HW_BREAKPOINT
          ./scripts/config --enable CONFIG_DEBUG_HW_BREAKPOINTS

          # Debug, BPF, and Tracing flags
          ./scripts/config --enable CONFIG_DEBUG_FS
          ./scripts/config --enable CONFIG_DEBUG_KERNEL
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --enable CONFIG_BPF_JIT_ALWAYS_ON
          ./scripts/config --enable CONFIG_BPF_EVENTS
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_FTRACE
          ./scripts/config --enable CONFIG_FUNCTION_TRACER
          ./scripts/config --enable CONFIG_TRACING
          ./scripts/config --enable CONFIG_DYNAMIC_FTRACE
          ./scripts/config --enable CONFIG_FTRACE_SYSCALLS
          ./scripts/config --enable CONFIG_HAVE_SYSCALL_TRACEPOINTS
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --enable CONFIG_UPROBES
          ./scripts/config --enable CONFIG_UPROBE_EVENTS
          ./scripts/config --enable CONFIG_RETPROBES
          ./scripts/config --enable CONFIG_PROBE_EVENTS
          ./scripts/config --enable CONFIG_EVENT_TRACING
          ./scripts/config --enable CONFIG_PERF_EVENTS
          ./scripts/config --enable CONFIG_HAVE_PERF_EVENTS
          ./scripts/config --enable CONFIG_ANON_INODES
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_IKCONFIG
          ./scripts/config --enable CONFIG_IKCONFIG_PROC
          ./scripts/config --enable CONFIG_FRAME_POINTER
          ./scripts/config --disable CONFIG_STRIP_ASM_SYMS
          ./scripts/config --disable CONFIG_STRICT_KERNEL_RWX
          ./scripts/config --disable CONFIG_STRICT_MODULE_RWX
          ./scripts/config --enable CONFIG_SECURITY_SELINUX_DEVELOP
          ./scripts/config --disable CONFIG_SECURITY_PERF_EVENTS_RESTRICT
          
          # Fix for interactive prompts: Sync config and accept defaults for anything new
* make olddefconfig

      - name: Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Added KCFLAGS to handle potential issues with newer GCC
          make -j$(nproc) Image.gz dtbs

      - name: Manual APatch Injection
        run: |
          wget https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux -O kptools
          wget https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android -O kpimg
          chmod +x kptools
          ./kptools -p --image arch/arm64/boot/Image.gz --skey "Sp680226" --kpimg kpimg --out arch/arm64/boot/Image.gz-patched
          mv arch/arm64/boot/Image.gz-patched arch/arm64/boot/Image.gz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RPi4-Research-Kernel
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/broadcom/*.dtb
